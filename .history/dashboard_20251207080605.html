<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring A</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <nav class="sidebar">
        <div class="logo">
            <h2>SMK <span>Bisa</span></h2>
        </div>
        <div class="menu-item active">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                </path>
            </svg>
            Dashboard
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <div>
                <h1>Monitor Nilai Informatika</h1>
                <p class="subtitle">Data Real-time dari Google Sheets</p>
            </div>
            <button class="btn-refresh" onclick="loadData()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                    </path>
                </svg>
                Refresh Data
            </button>
        </header>

        <div class="stats-container">
            <div class="card stat-card">
                <div class="stat-title">Total Siswa</div>
                <div class="stat-value" id="totalSiswa">0</div>
                <div class="stat-icon bg-blue">👥</div>
            </div>
            <div class="card stat-card">
                <div class="stat-title">Rata-Rata</div>
                <div class="stat-value" id="rataRata">0</div>
                <div class="stat-icon bg-orange">📊</div>
            </div>
            <div class="card stat-card">
                <div class="stat-title">Nilai Tertinggi</div>
                <div class="stat-value" id="nilaiTertinggi">0</div>
                <div class="stat-icon bg-green">🏆</div>
            </div>
        </div>

        <div class="content-grid">

            <div class="card chart-section">
                <h3>Distribusi Nilai Siswa</h3>
                <div class="chart-wrapper">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>

            <div class="card table-section">
                <div class="table-header">
                    <h3>Daftar Hasil Ujian</h3>
                    <div class="controls">
                        <select id="sortFilter" onchange="applySort()">
                            <option value="time_desc">Waktu: Terbaru</option>
                            <option value="time_asc">Waktu: Terlama (Awal)</option>
                            <option value="score_desc">Nilai: Tertinggi</option>
                            <option value="score_asc">Nilai: Terendah</option>
                        </select>
                        <input type="text" id="searchInput" placeholder="Cari nama..." onkeyup="applySearch()">
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="resultTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Waktu Submit</th>
                                <th>Nama Siswa</th>
                                <th>Nilai</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                    <div id="loading" class="loading-state">Sedang memuat data...</div>
                    <div id="empty" class="empty-state" style="display:none;">Belum ada data.</div>
                </div>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>

</html>
